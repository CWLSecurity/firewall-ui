name: Firewall UI Deploy (Cloudflare Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_BOT_API_BASE_URL: https://bot.firewall-wallet.com
          VITE_FACTORY_LOG_LOOKBACK_BLOCKS: ${{ vars.VITE_FACTORY_LOG_LOOKBACK_BLOCKS }}
          VITE_QUEUE_LOG_LOOKBACK_BLOCKS: ${{ vars.VITE_QUEUE_LOG_LOOKBACK_BLOCKS }}
          VITE_ADDON_PACK_CANDIDATE_IDS: ${{ vars.VITE_ADDON_PACK_CANDIDATE_IDS }}
        run: npm run build

      - name: Validate Cloudflare deploy config
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "Missing secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CF_PAGES_PROJECT_NAME" || { echo "Missing variable: CF_PAGES_PROJECT_NAME"; exit 1; }

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT_NAME }} --branch=main
