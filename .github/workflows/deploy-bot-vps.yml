name: Firewall Bot Deploy (VPS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-bot-vps.yml

concurrency:
  group: bot-deploy-main
  cancel-in-progress: true

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate bot deploy config
        env:
          BOT_DEPLOY_HOST: ${{ vars.BOT_DEPLOY_HOST }}
          BOT_DEPLOY_USER: ${{ vars.BOT_DEPLOY_USER }}
          BOT_DEPLOY_PORT: ${{ vars.BOT_DEPLOY_PORT }}
          BOT_HEALTHCHECK_URL: ${{ vars.BOT_HEALTHCHECK_URL }}
          BOT_DEPLOY_SSH_KEY: ${{ secrets.BOT_DEPLOY_SSH_KEY }}
        run: |
          BOT_DEPLOY_HOST="${BOT_DEPLOY_HOST:-68.183.4.10}"
          BOT_DEPLOY_USER="${BOT_DEPLOY_USER:-root}"
          BOT_DEPLOY_PORT="${BOT_DEPLOY_PORT:-22}"
          BOT_HEALTHCHECK_URL="${BOT_HEALTHCHECK_URL:-https://bot.firewall-wallet.com/api/v1/bot/health}"

          test -n "$BOT_DEPLOY_HOST" || { echo "BOT_DEPLOY_HOST is empty after fallback."; exit 1; }
          test -n "$BOT_DEPLOY_USER" || { echo "BOT_DEPLOY_USER is empty after fallback."; exit 1; }
          test -n "$BOT_DEPLOY_SSH_KEY" || { echo "Missing secret: BOT_DEPLOY_SSH_KEY"; exit 1; }
          echo "Resolved BOT_DEPLOY_HOST=$BOT_DEPLOY_HOST"
          echo "Resolved BOT_DEPLOY_USER=$BOT_DEPLOY_USER"
          echo "Resolved BOT_DEPLOY_PORT=$BOT_DEPLOY_PORT"
          echo "Resolved BOT_HEALTHCHECK_URL=$BOT_HEALTHCHECK_URL"

      - name: Configure SSH key and known_hosts
        env:
          BOT_DEPLOY_HOST: ${{ vars.BOT_DEPLOY_HOST }}
          BOT_DEPLOY_SSH_KEY: ${{ secrets.BOT_DEPLOY_SSH_KEY }}
        run: |
          BOT_DEPLOY_HOST="${BOT_DEPLOY_HOST:-68.183.4.10}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if printf '%s' "$BOT_DEPLOY_SSH_KEY" | grep -q 'PRIVATE KEY-----'; then
            # Multiline private key stored directly in the secret (OpenSSH/PEM).
            printf '%s\n' "$BOT_DEPLOY_SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_ed25519
          else
            # Fallback for base64-encoded key payload.
            printf '%s' "$BOT_DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || {
            echo "Invalid BOT_DEPLOY_SSH_KEY format (or passphrase-protected key)."
            echo "Save full unencrypted OpenSSH private key in BOT_DEPLOY_SSH_KEY."
            exit 1
          }
          ssh-keyscan -H "$BOT_DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy bot on VPS
        env:
          BOT_DEPLOY_HOST: ${{ vars.BOT_DEPLOY_HOST }}
          BOT_DEPLOY_USER: ${{ vars.BOT_DEPLOY_USER }}
          BOT_DEPLOY_PORT: ${{ vars.BOT_DEPLOY_PORT }}
        run: |
          BOT_DEPLOY_HOST="${BOT_DEPLOY_HOST:-68.183.4.10}"
          BOT_DEPLOY_USER="${BOT_DEPLOY_USER:-root}"
          PORT="${BOT_DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$PORT" "${BOT_DEPLOY_USER}@${BOT_DEPLOY_HOST}" '/usr/local/bin/deploy-firewall-bot'

      - name: Verify bot health endpoint
        env:
          BOT_HEALTHCHECK_URL: ${{ vars.BOT_HEALTHCHECK_URL }}
        run: |
          BOT_HEALTHCHECK_URL="${BOT_HEALTHCHECK_URL:-https://bot.firewall-wallet.com/api/v1/bot/health}"
          curl -fsSL "$BOT_HEALTHCHECK_URL" | grep -q '"ok":true'
